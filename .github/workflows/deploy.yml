name: Deploy to Vultr VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # 👇 就是這一行！告訴 GitHub 去解鎖 production 的 Environment secrets
    environment: MyVPS 
    
    steps:
      - name: SSH into VPS and trigger deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/MyCashback
            git pull
            npm install
            pm2 restart mycashback